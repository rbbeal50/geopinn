[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopinn"
version = "0.1.0"
description = "Physics-informed neural networks for geophysical forward and inverse problems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
geopinn-train = "geopinn.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geopinn = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks"]
exclude = [".venv", "outputs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["geopinn"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
files = ["src/geopinn", "tests", "benchmarks"]

# scipy, matplotlib, PyYAML, and pytest do not ship complete type information.
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "yaml", "yaml.*", "pytest", "pytest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
